apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Intentionally omits bootstrap-owner-job.yaml so routine `kubectl apply -k`
# does not re-run the one-time owner bootstrap step.
resources:
  - namespace.yaml
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
