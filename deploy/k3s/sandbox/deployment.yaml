apiVersion: apps/v1
kind: Deployment
metadata:
  name: voxward-sandbox
  namespace: voxward-sandbox
  labels:
    app.kubernetes.io/name: voxward-sandbox
    app.kubernetes.io/component: sandbox
    app.kubernetes.io/part-of: voxward
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: voxward-sandbox
      app.kubernetes.io/component: sandbox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: voxward-sandbox
        app.kubernetes.io/component: sandbox
        app.kubernetes.io/part-of: voxward
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: voxward-sandbox
          # Immutable attested OCI image built by .github/workflows/container-provenance.yml (verify via scripts/verify-provenance.mjs).
          image: ghcr.io/tpmoonchefryan/voxward@sha256:5f1cd93af103cacc74cff9ee9773ddedac92c6057f1330df7b032fcdf7b5028c
          imagePullPolicy: IfNotPresent
          args:
            - apps/server/dist/sandbox-main.js
          ports:
            - name: http
              containerPort: 3100
              protocol: TCP
          env:
            - name: VOXWARD_SANDBOX_ENABLED
              value: "true"
            - name: VOXWARD_SANDBOX_HOST
              value: "0.0.0.0"
            - name: VOXWARD_SANDBOX_PORT
              value: "3100"
            - name: VOXWARD_SANDBOX_DB
              value: "/var/lib/voxward-sandbox/voxward-sandbox.sqlite3"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: sandbox-data
              mountPath: /var/lib/voxward-sandbox
            - name: runtime-tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: sandbox-data
          emptyDir:
            sizeLimit: 256Mi
        - name: runtime-tmp
          emptyDir:
            sizeLimit: 64Mi
