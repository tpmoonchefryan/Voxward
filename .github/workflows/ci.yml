name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Deps, Typecheck, Tests, Build & DS Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check layer dependency boundaries
        run: pnpm check:deps

      - name: Typecheck packages, apps, and bench
        run: pnpm typecheck

      - name: Build production bundles
        run: pnpm build

      - name: Run full unit & integration test suite
        run: pnpm test

      - name: Check design system compliance
        run: pnpm check:ds

      - name: Verify deployment configuration invariants
        run: node scripts/deploy-check.mjs --env-file deploy/server/server.env.example

      - name: Verify live OCI SLSA Build Provenance Attestation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-provenance.mjs
